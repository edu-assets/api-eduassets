name: Uptime

# External monitoring of the public eduAssets endpoints (API health/readiness, app, landing page,
# documentation host, TLS expiry and security.txt validity). A failed scheduled run is reported by
# GitHub's Actions notifications to the account that last changed this schedule.
# Note: GitHub pauses scheduled workflows after 60 days without repository activity.
#
# The database readiness probe (/ready runs SELECT 1) wakes the Neon compute, which then stays up for
# ~5 minutes. Probing it every 15 minutes woke the compute ~96 times a day (about a third of all hours,
# nights included), so /ready only runs
# on the second schedule: every 2 hours from 07:17 to 19:17 Brasília time (UTC-3), Monday to Saturday,
# when the database is already awake for school use. Manual runs always include /ready.
# If you change that cron, update the string compared in CHECK_READY below to match.
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
    - cron: '17 10-22/2 * * 1-6'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Probe public endpoints
        env:
          CHECK_READY: ${{ github.event_name != 'schedule' || github.event.schedule == '17 10-22/2 * * 1-6' }}
        run: bash deploy/scripts/public-uptime-check.sh
