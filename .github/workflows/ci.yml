name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: eduassets_test
          POSTGRES_USER: eduassets_test
          POSTGRES_PASSWORD: eduassets_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eduassets_test -d eduassets_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://eduassets_test:eduassets_test@127.0.0.1:5432/eduassets_test?schema=public
      JWT_SECRET: synthetic-ci-only-secret-0123456789abcdef
      NODE_ENV: test
      HOST: 127.0.0.1
      PORT: 3000
      TRUST_PROXY: "0"
      CORS_ORIGIN: https://app.example.invalid
      SEED_ADMIN_EMAIL: ci-admin@example.invalid
      SEED_ADMIN_PASSWORD: Synthetic-CI-Admin-Password-01
      VITE_API_BASE_URL: https://api.example.invalid
      VITE_RFID_BRIDGE_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci
      - run: npm ci --prefix backend
      - run: npm ci --prefix frontend
      - name: Validate Prisma schema without DIRECT_URL
        run: cd backend && unset DIRECT_URL && npx prisma validate --config prisma.config.ts
      - name: Generate Prisma Client
        run: npm --prefix backend run prisma:generate
      - run: npm --prefix backend run migrate:deploy
      - run: npm --prefix backend run db:seed
      - name: Verify seed idempotency
        run: npm --prefix backend run db:seed
      - run: npm --prefix backend test
      - run: npm --prefix backend run test:integration
      - run: npm --prefix frontend run typecheck
      - run: npm --prefix frontend test
      - run: npm --prefix backend run build
      - run: npm --prefix frontend run build
      - name: Verify compiled backend startup and database readiness
        shell: bash
        run: |
          npm --prefix backend start > /tmp/eduassets-backend.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/ready >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/eduassets-backend.log
          exit 1
      - name: Build Docker release targets
        run: |
          docker build --target runtime -f backend/Dockerfile backend
          docker build --target migration -f backend/Dockerfile backend
      - name: Validate deployment templates
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vercel = JSON.parse(fs.readFileSync('frontend/vercel.json', 'utf8'));
          const csp = vercel.headers.flatMap((entry) => entry.headers).find((entry) => entry.key === 'Content-Security-Policy')?.value ?? '';
          if (!csp.includes("connect-src 'self' https://api.eduassets.tech")) throw new Error('CSP does not allow the documented API origin');
          if (csp.includes("connect-src 'self';")) throw new Error('CSP still restricts connect-src to self only');
          NODE
          grep -Fq 'location = /auth/rfid' deploy/nginx/eduassets-api.conf.example
          grep -Fq 'location = /ws/rfid' deploy/nginx/eduassets-api.conf.example
          cat > .env.production <<'EOF'
          DATABASE_URL=postgresql://synthetic:synthetic@127.0.0.1:5432/eduassets
          JWT_SECRET=synthetic-compose-validation-secret-0123456789abcdef
          CORS_ORIGIN=https://app.example.invalid
          TRUST_PROXY=0
          RFID_BRIDGE_ENABLED=false
          EOF
          trap 'rm -f .env.production' EXIT
          docker compose --env-file .env.production -f docker-compose.production.yml config --quiet

  production-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: eduassets_test
          POSTGRES_USER: eduassets_test
          POSTGRES_PASSWORD: eduassets_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eduassets_test -d eduassets_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://eduassets_test:eduassets_test@127.0.0.1:5432/eduassets_test?schema=public
      JWT_SECRET: synthetic-production-smoke-secret-0123456789abcdef
      CORS_ORIGIN: https://app.example.invalid
      TRUST_PROXY: "0"
      RFID_BRIDGE_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - name: Build production images
        run: |
          docker build --target runtime -t eduassets-backend:ci -f backend/Dockerfile backend
          docker build --target migration -t eduassets-backend-migration:ci -f backend/Dockerfile backend
      - name: Wait for disposable PostgreSQL
        shell: bash
        run: |
          for attempt in {1..30}; do
            if pg_isready -h 127.0.0.1 -p 5432 -U eduassets_test -d eduassets_test; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Apply migrations with the production migration image
        run: |
          docker run --rm --network host \
            -e NODE_ENV=production \
            -e DATABASE_URL="$DATABASE_URL" \
            -e JWT_SECRET="$JWT_SECRET" \
            -e CORS_ORIGIN="$CORS_ORIGIN" \
            -e TRUST_PROXY="$TRUST_PROXY" \
            -e RFID_BRIDGE_ENABLED="$RFID_BRIDGE_ENABLED" \
            eduassets-backend-migration:ci npm run migrate:deploy
      - name: Start and poll the production container
        shell: bash
        run: |
          set -Eeuo pipefail
          container=eduassets-production-smoke
          cleanup() { docker rm -f "$container" >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          docker run -d --name "$container" --network host --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --cap-drop ALL --security-opt no-new-privileges --init \
            -e NODE_ENV=production \
            -e HOST=0.0.0.0 \
            -e PORT=3000 \
            -e DATABASE_URL="$DATABASE_URL" \
            -e JWT_SECRET="$JWT_SECRET" \
            -e CORS_ORIGIN="$CORS_ORIGIN" \
            -e TRUST_PROXY="$TRUST_PROXY" \
            -e RFID_BRIDGE_ENABLED="$RFID_BRIDGE_ENABLED" \
            eduassets-backend:ci >/dev/null

          for attempt in {1..60}; do
            if ! docker inspect -f '{{.State.Running}}' "$container" 2>/dev/null | grep -qx true; then
              echo 'Production container exited before readiness.'
              docker logs --tail=200 "$container" || true
              exit 1
            fi
            if curl --fail --silent http://127.0.0.1:3000/ready >/dev/null; then
              docker stop --time 15 "$container" >/dev/null
              exit_code=$(docker inspect -f '{{.State.ExitCode}}' "$container")
              if [ "$exit_code" != 0 ]; then
                echo "Production container exited with code $exit_code after SIGTERM."
                docker logs --tail=200 "$container" || true
                exit 1
              fi
              exit 0
            fi
            sleep 1
          done

          echo 'Production container did not become ready.'
          docker logs --tail=200 "$container" || true
          exit 1
