services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    image: eduassets-backend:${EDUASSETS_IMAGE_TAG:-local}
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      RFID_BRIDGE_ENABLED: "false"
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.production}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.production}
      CORS_ORIGIN: ${CORS_ORIGIN:?Set CORS_ORIGIN in .env.production}
      TRUST_PROXY: ${TRUST_PROXY:?Set TRUST_PROXY in .env.production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Optional self-service password recovery email (all four SMTP/MAIL values, or none).
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # Optional contact details shown in emails; SUPPORT_EMAIL is also the Reply-To address.
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-}
      # Optional Web Push notifications for administrators (all three VAPID values, or none).
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3000}:3000"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: migration
    image: eduassets-backend-migration:${EDUASSETS_IMAGE_TAG:-local}
    env_file: .env.production
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    environment:
      NODE_ENV: production
      RFID_BRIDGE_ENABLED: "false"
    command: ["npm", "run", "migrate:deploy"]
    profiles: ["release"]

  seed:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: migration
    image: eduassets-backend-migration:${EDUASSETS_IMAGE_TAG:-local}
    env_file: .env.production
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    environment:
      NODE_ENV: production
      RFID_BRIDGE_ENABLED: "false"
    command: ["npm", "run", "db:seed"]
    profiles: ["release"]
    depends_on:
      migrate:
        condition: service_completed_successfully
